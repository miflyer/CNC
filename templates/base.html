{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Биржа CNC{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header>
        <strong>CNC Exchange</strong>

        <nav>
            <a href="{% url 'index' %}">Рынок</a>

            {% if user.is_authenticated %}
                <span>{{ user.username }}: {{ user.wallet.balance }} $</span>
                <form method="post" action="{% url 'logout' %}" style="display: inline;">
                    {% csrf_token %}
                    <button type="submit">Выйти</button>
                </form>
            {% else %}
                <a href="{% url 'register' %}">Регистрация</a>
                <a href="{% url 'login' %}">Вход</a>
            {% endif %}
        </nav>

    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
